<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VIVIVIC 서류관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2337352f'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Inter,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./css/app.css" />
<style>
  html, body { background: #fbfbfa; }
  body { color: #37352f; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #e3e2e0; border-radius: 6px; border: 3px solid #fbfbfa; }
  ::-webkit-scrollbar-track { background: transparent; }
  .card { background:#fff; border:1px solid #ededeb; border-radius:16px; box-shadow:0 1px 2px 0 rgb(0 0 0 / .05); }
  .btn { border-radius:8px; font-weight:700; font-size:13px; padding:8px 18px; transition:all .12s; }
  .btn-primary { background:#37352f; color:#fff; }
  .btn-primary:hover { background:#2b2a25; }
  .btn-primary:disabled { opacity:.45; cursor:default; }
  .btn-ghost { background:#f1f1ef; color:#37352f; }
  .btn-ghost:hover { background:#ededeb; }
  .chip { border-radius:999px; font-size:12px; font-weight:600; padding:5px 12px; transition:all .12s; }
  .chip-off { background:#fff; border:1px solid #ededeb; color:#787774; }
  .chip-off:hover { background:#f7f7f5; }
  .chip-on { background:#37352f; border:1px solid #37352f; color:#fff; }
  .field { width:100%; font-size:13px; padding:9px 12px; border-radius:8px; border:1px solid #ededeb;
           background:#fff; transition:border-color .12s; }
  .field::placeholder { color:#9b9a97; }
  .field:focus { outline:none; border-color:#37352f; }
  .drawer { transition: transform .22s cubic-bezier(.4,0,.2,1); }
  .vv-sheet { border-collapse:collapse; font-size:11px; }
  .vv-sheet td, .vv-sheet th { border:1px solid #ededeb; padding:3px 6px; white-space:nowrap; }
  .vv-sheet tr:nth-child(even) { background:#fafaf9; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body class="font-sans text-[14px]">

<!-- ── 로그인 ───────────────────────────────────────────── -->
<section id="login" class="min-h-screen flex items-center justify-center px-6" hidden>
  <form id="loginForm" class="w-full max-w-[340px] p-8 bg-white border border-line rounded-2xl shadow-sm">
    <div class="flex items-center gap-2 mb-1">
      <span class="font-bold tracking-[.18em] text-[16px]">VIVIVIC</span>
      <span class="text-[10px] font-bold text-faint bg-chip rounded px-1.5 py-0.5 tracking-wider">v0.19.1</span>
    </div>
    <h1 class="text-[15px] font-bold mb-1">서류관리</h1>
    <p class="text-[12px] text-muted mb-6">에이엠티 앱과 같은 계정으로 들어갑니다.</p>

    <label class="block mb-3">
      <span class="text-[11px] font-bold text-faint tracking-wide">이메일</span>
      <input id="email" name="username" type="email" autocomplete="username" required class="field mt-1" placeholder="name@example.com" />
    </label>
    <label class="block mb-5">
      <span class="text-[11px] font-bold text-faint tracking-wide">비밀번호</span>
      <input id="password" name="password" type="password" autocomplete="current-password" required class="field mt-1" />
    </label>

    <button id="loginBtn" type="submit" class="btn btn-primary w-full">로그인</button>
    <p id="loginError" class="mt-3 text-[12px] text-danger" hidden></p>
    <button id="demoLink" type="button" class="mt-5 text-[12px] text-faint hover:text-ink underline">
      로그인 없이 데모 보기
    </button>
  </form>
</section>

<!-- ── 앱 ───────────────────────────────────────────────── -->
<div id="app" hidden>
<header class="w-full bg-white border-b border-line sticky top-0 z-[100]">
  <div class="max-w-[1400px] mx-auto px-6 h-[65px] flex items-center gap-6">
    <div class="flex items-center gap-2 shrink-0">
      <span class="font-bold tracking-[.18em] text-[17px]">VIVIVIC</span>
      <span class="text-[10px] font-bold text-faint bg-chip rounded px-1.5 py-0.5 tracking-wider">v0.19.1</span>
    </div>

    <nav class="flex items-center gap-1 text-[13px] font-bold">
      <span class="px-3 py-1.5 rounded-md bg-chip text-ink">서류관리</span>
    </nav>

    <div class="ml-auto flex items-center gap-2">
      <span id="cloudState" class="text-[11px] font-bold text-faint tracking-wide"></span>
      <button id="btnUpdate" class="btn btn-primary" hidden>새 버전 · 새로고침</button>
      <button id="btnConnect" class="btn btn-ghost" hidden>폴더 연결</button>
      <button id="btnSync" class="btn btn-ghost" hidden>드라이브 스캔</button>
      <span id="userEmail" class="text-[12px] text-muted"></span>
      <button id="btnSignOut" class="text-[12px] text-faint hover:text-ink font-bold underline" hidden>로그아웃</button>
    </div>
  </div>
</header>

<main class="max-w-[1400px] mx-auto px-6 py-8">

  <!-- 클라우드에 데이터가 없을 때 -->
  <section id="empty" class="card p-10 max-w-[680px] mx-auto mt-10" hidden>
    <h1 class="text-[22px] font-bold mb-2">아직 올라간 서류 목록이 없습니다</h1>
    <p class="text-muted leading-relaxed mb-6">
      맥에서 구글 드라이브 <span class="font-semibold text-ink">중국</span> 폴더를 한 번 스캔해 올리면,
      그 뒤로는 폰이든 다른 PC든 로그인만 하면 바로 보입니다.
      파일 본체는 올라가지 않고 <span class="font-semibold text-ink">목록만</span> 클라우드에 저장됩니다.
    </p>
    <button id="btnSync2" class="btn btn-primary">드라이브 폴더 스캔해서 올리기</button>
    <p id="unsupported" class="mt-5 text-[12px] text-muted" hidden>
      이 브라우저는 폴더 접근을 지원하지 않습니다. 스캔은 맥·PC의 Chrome에서 한 번만 해주면 됩니다.
    </p>
  </section>

  <section id="dash" hidden>
    <div id="kpis" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-6"></div>

    <div class="card p-4 mb-6">
      <div class="flex flex-wrap items-center gap-2">
        <div id="vendorChips" class="flex flex-wrap items-center gap-1.5"></div>
        <span class="w-px h-5 bg-line mx-1"></span>
        <div id="statusChips" class="flex flex-wrap items-center gap-1.5"></div>
        <input id="search" type="search" placeholder="차수 · 파일명 검색 — 전체 파일에서 찾습니다" class="field ml-auto w-[240px]" />
      </div>
    </div>

    <section id="fileHits" class="mb-6" hidden></section>

    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    <div id="emptyState" class="card p-12 text-center text-muted" hidden>조건에 맞는 차수가 없습니다.</div>

    <!-- ── 정의 안 된 파일 ── -->
    <section id="define" class="mt-10" hidden>
      <div class="flex items-center gap-3 mb-3">
        <h2 class="text-[13px] font-bold text-faint tracking-wide">차수가 붙지 않은 파일</h2>
        <span id="defineCount" class="text-[12px] text-faint font-semibold"></span>
        <div class="ml-auto flex items-center gap-2">
          <button id="btnRules" class="btn btn-ghost">규칙 <span id="ruleCount"></span></button>
          <button id="btnExcluded" class="btn btn-ghost">제외함 <span id="excludedCount"></span></button>
        </div>
      </div>
      <div id="looseGroups" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>
  </section>
</main>
</div>

<!-- ── 선택 액션바 ── -->
<div id="actionBar"
     class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[210] bg-ink text-white rounded-xl shadow-lg
            flex items-center gap-2 pl-4 pr-2 py-2" hidden>
  <span id="selCount" class="text-[13px] font-bold"></span>
  <button id="btnAssign" class="btn bg-white text-ink hover:bg-hover">지정</button>
  <button id="btnExclude" class="btn bg-white/15 text-white hover:bg-white/25">제외</button>
  <button id="btnClearSel" class="text-[12px] text-white/60 hover:text-white px-2">취소</button>
</div>

<!-- ── 지정 모달 ── -->
<div id="assignScrim" class="fixed inset-0 bg-black/30 z-[220] flex items-center justify-center px-6" hidden>
  <div class="w-full max-w-[460px] bg-white border border-line rounded-2xl shadow-lg p-7">
    <h3 class="text-[16px] font-bold mb-1">선택한 파일 지정</h3>
    <p id="assignSummary" class="text-[12px] text-muted mb-5"></p>

    <label class="block mb-1">
      <span class="text-[11px] font-bold text-faint tracking-wide">거래처</span>
      <select id="asVendor" class="field mt-1"></select>
    </label>
    <input id="asVendorNew" class="field mb-3" placeholder="새 거래처 이름" hidden />

    <label class="block mb-3">
      <span class="text-[11px] font-bold text-faint tracking-wide">단계</span>
      <select id="asStage" class="field mt-1"></select>
    </label>

    <label class="block mb-1">
      <span class="text-[11px] font-bold text-faint tracking-wide">차수</span>
      <select id="asBatch" class="field mt-1"></select>
    </label>
    <input id="asBatchNew" class="field mb-3" placeholder="새 차수 — 예: 26-18" hidden />
    <div id="asBatchDocs" class="mb-5"></div>

    <div class="border-t border-line pt-4 mb-5">
      <label class="flex items-start gap-2 cursor-pointer">
        <input id="asRule" type="checkbox" class="mt-0.5" />
        <span class="text-[12px] leading-relaxed">
          <span class="font-semibold">앞으로도 같은 규칙 적용</span><br />
          <span class="text-muted">이 키워드가 들어간 파일은 새로 들어와도 자동으로 이렇게 분류됩니다.</span>
        </span>
      </label>
      <input id="asKeyword" class="field mt-2" placeholder="키워드" hidden />
    </div>

    <div class="flex items-center gap-2">
      <button id="asSave" class="btn btn-primary">확정</button>
      <button id="asCancel" class="btn btn-ghost">미정으로 두기</button>
    </div>
  </div>
</div>

<!-- ── 파일 보기 ── -->
<div id="viewerScrim" class="fixed inset-0 bg-black/35 z-[240] flex items-center justify-center px-6 py-8" hidden>
  <div class="w-full max-w-[900px] h-full flex flex-col bg-white border border-line rounded-2xl shadow-lg">
    <div class="border-b border-line px-7 py-3 flex items-center gap-3 shrink-0">
      <div class="min-w-0">
        <div id="viewerTitle" class="text-[14px] font-bold truncate"></div>
        <div id="viewerMeta" class="text-[11px] text-faint truncate"></div>
      </div>
      <div class="ml-auto flex items-center gap-1.5 shrink-0">
        <span id="viewerCount" class="text-[12px] text-faint font-semibold mr-1"></span>
        <button id="viewerPrev" class="btn btn-ghost px-3" hidden>←</button>
        <button id="viewerNext" class="btn btn-ghost px-3" hidden>→</button>
        <button id="viewerClose" class="btn btn-ghost">닫기</button>
      </div>
    </div>
    <div id="viewerBody" class="flex-1 min-h-0 p-7"></div>
  </div>
</div>

<!-- ── 규칙 · 제외함 서랍 ── -->
<div id="panelScrim" class="fixed inset-0 bg-black/25 z-[190]" hidden></div>
<aside id="panel"
       class="drawer fixed top-0 right-0 h-full w-full max-w-[560px] bg-white border-l border-line z-[200]
              translate-x-full overflow-y-auto">
  <div id="panelBody"></div>
</aside>

<div id="scrim" class="fixed inset-0 bg-black/25 z-[190]" hidden></div>
<aside id="drawer"
       class="drawer fixed top-0 right-0 h-full w-full max-w-[560px] bg-white border-l border-line z-[200]
              translate-x-full overflow-y-auto">
  <div id="drawerBody"></div>
</aside>

<div id="toast"
     class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white text-[13px] font-semibold
            px-4 py-2.5 rounded-lg shadow-lg z-[300] opacity-0 pointer-events-none transition-opacity"></div>

<script src="./js/vendor/xlsx.full.min.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
