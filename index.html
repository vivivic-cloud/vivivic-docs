<!-- ── 로그인 ───────────────────────────────────────────── -->
<section id="login" class="min-h-screen flex items-center justify-center px-6" hidden>
  <form id="loginForm" class="w-full max-w-[340px] p-8 bg-white border border-line rounded-2xl shadow-sm">
    <div class="flex items-center gap-2 mb-1">
      <span class="font-bold tracking-[.18em] text-[16px]">VIVIVIC</span>
      <span class="text-[10px] font-bold text-faint bg-chip rounded px-1.5 py-0.5 tracking-wider">v0.2.0</span>
    </div>
    <h1 class="text-[15px] font-bold mb-1">서류관리</h1>
    <p class="text-[12px] text-muted mb-6">에이엠티 앱과 같은 계정으로 들어갑니다.</p>

    <label class="block mb-3">
      <span class="text-[11px] font-bold text-faint tracking-wide">이메일</span>
      <input id="email" type="email" autocomplete="username" required class="field mt-1" placeholder="name@example.com" />
    </label>
    <label class="block mb-5">
      <span class="text-[11px] font-bold text-faint tracking-wide">비밀번호</span>
      <input id="password" type="password" autocomplete="current-password" required class="field mt-1" />
    </label>

    <button id="loginBtn" type="submit" class="btn btn-primary w-full">로그인</button>
    <p id="loginError" class="mt-3 text-[12px] text-danger" hidden></p>
    <button id="demoLink" type="button" class="mt-5 text-[12px] text-faint hover:text-ink underline">
      로그인 없이 데모 보기
    </button>
  </form>
</section>

<!-- ── 앱 ───────────────────────────────────────────────── -->
<div id="app" hidden>
<header class="w-full bg-white border-b border-line sticky top-0 z-[100]">
  <div class="max-w-[1400px] mx-auto px-6 h-[65px] flex items-center gap-6">
    <div class="flex items-center gap-2 shrink-0">
      <span class="font-bold tracking-[.18em] text-[17px]">VIVIVIC</span>
      <span class="text-[10px] font-bold text-faint bg-chip rounded px-1.5 py-0.5 tracking-wider">v0.2.0</span>
    </div>

    <nav class="flex items-center gap-1 text-[13px] font-bold">
      <a class="px-3 py-1.5 rounded-md text-faint hover:bg-hover hover:text-ink transition-all"
         href="https://vivivic-cloud.github.io/vivivic-apps/에이엠티/에이엠티.html">발주서</a>
      <a class="px-3 py-1.5 rounded-md text-faint hover:bg-hover hover:text-ink transition-all"
         href="https://vivivic-cloud.github.io/vivivic-apps/에이엠티/에이엠티.html">재단발주</a>
      <a class="px-3 py-1.5 rounded-md text-faint hover:bg-hover hover:text-ink transition-all"
         href="https://vivivic-cloud.github.io/vivivic-apps/에이엠티/에이엠티.html">공정관리</a>
      <span class="px-3 py-1.5 rounded-md bg-chip text-ink">서류관리</span>
    </nav>

    <div class="ml-auto flex items-center gap-2">
      <span id="cloudState" class="text-[11px] font-bold text-faint tracking-wide"></span>
      <button id="btnSync" class="btn btn-ghost" hidden>드라이브 스캔</button>
      <span id="userEmail" class="text-[12px] text-muted"></span>
      <button id="btnSignOut" class="text-[12px] text-faint hover:text-ink font-bold underline" hidden>로그아웃</button>
    </div>
  </div>
</header>

<main class="max-w-[1400px] mx-auto px-6 py-8">

  <!-- 클라우드에 데이터가 없을 때 -->
  <section id="empty" class="card p-10 max-w-[680px] mx-auto mt-10" hidden>
    <h1 class="text-[22px] font-bold mb-2">아직 올라간 서류 목록이 없습니다</h1>
    <p class="text-muted leading-relaxed mb-6">
      맥에서 구글 드라이브 <span class="font-semibold text-ink">중국</span> 폴더를 한 번 스캔해 올리면,
      그 뒤로는 폰이든 다른 PC든 로그인만 하면 바로 보입니다.
      파일 본체는 올라가지 않고 <span class="font-semibold text-ink">목록만</span> 클라우드에 저장됩니다.
    </p>
    <button id="btnSync2" class="btn btn-primary">드라이브 폴더 스캔해서 올리기</button>
    <p id="unsupported" class="mt-5 text-[12px] text-muted" hidden>
      이 브라우저는 폴더 접근을 지원하지 않습니다. 스캔은 맥·PC의 Chrome에서 한 번만 해주면 됩니다.
    </p>
  </section>

  <section id="dash" hidden>
    <div id="kpis" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>

    <div class="card p-4 mb-6">

function buildBatches(files) {

      docNo: parseDocNo(f.name),

      continue;

    const id = `${f.vendor}::${batch.label}`;
    if (!batches.has(id)) {

function summarize(b) {
  const stages = STAGES.map((s) => ({
    ...s,
    docs: b.docs.filter((d) => d.stageKey === s.key),

  const aside = ASIDE.map((a) => ({ ...a, docs: b.docs.filter((d) => d.stageKey === a.key) }));

  const lastDate = dates.length ? dates[dates.length - 1] : null;

  return {
    ...b,
    stages,
    aside,
    done,
    total: STAGES.length,
    percent: Math.round((done / STAGES.length) * 100),
    issues,
    lastDate,
    status: done === STAGES.length ? 'done' : done === 0 ? 'empty' : 'active',

  $('#loose').innerHTML = `
    <h2 class="text-[13px] font-bold text-faint tracking-wide mb-3">차수가 붙지 않은 파일</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      ${[...groups.entries()].map(([k, docs]) => `
        <div class="card p-5">
          <div class="flex items-center justify-between mb-3">
            <span class="font-bold text-[14px]">${esc(label[k] ?? k)}</span>
            <span class="text-[12px] text-faint font-semibold">${docs.length}건</span>
          </div>
          <ul class="space-y-1.5 max-h-[220px] overflow-y-auto pr-1">
            ${docs.slice(0, 60).map((d, i) => `
              <li class="text-[12px] text-muted truncate" title="${esc(d.path)}">
                <button class="hover:text-ink hover:underline text-left truncate w-full" data-file="${esc(k)}:${i}">${esc(d.display)}</button>
              </li>`).join('')}
          </ul>
        </div>`).join('')}
    </div>`;

  for (const el of document.querySelectorAll('[data-file]')) {
    el.onclick = () => {
      const [k, i] = el.dataset.file.split(':');
      openDoc(groups.get(k)[Number(i)]);
    };
  }
}

/* ── 상세 서랍 ────────────────────────────────────────── */

function openDrawer(id) {
  state.openId = id;
  renderDrawer(id);
  $('#scrim').hidden = false;
  requestAnimationFrame(() => $('#drawer').classList.remove('translate-x-full'));
}

function closeDrawer() {
  state.openId = null;
  $('#drawer').classList.add('translate-x-full');
  $('#scrim').hidden = true;
}

function renderDrawer(id) {
  const b = state.batches.find((x) => x.id === id);
  if (!b) return closeDrawer();
  const ov = state.overlay[id] ?? {};

  const field = (key, label, opts = {}) => `
    <label class="block">
      <span class="text-[11px] font-bold text-faint tracking-wide">${label}</span>
      <input data-ov="${key}" type="${opts.type ?? 'text'}" value="${esc(ov[key] ?? '')}"
             ${opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : ''} class="field mt-1" />
    </label>`;

  const docLink = (d) => `
    <li>
      <button data-doc="${esc(d.path)}" class="text-left text-[12px] text-info hover:underline truncate w-full" title="${esc(d.path)}">
        ${esc(d.display)}
      </button>
      <span class="text-[11px] text-faint">${[d.date, fmtSize(d.size)].filter(Boolean).join(' · ')}</span>
    </li>`;

  $('#drawerBody').innerHTML = `
    <div class="sticky top-0 bg-white border-b border-line px-6 h-[65px] flex items-center gap-3 z-10">
      <div>
        <div class="text-[11px] font-bold text-faint tracking-wide">${esc(b.vendor)}</div>
        <div class="text-[17px] font-bold leading-tight">${esc(b.batch)}차</div>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <span class="text-[13px] font-bold">${b.done}<span class="text-faint">/7</span></span>
        <button id="drawerClose" class="btn btn-ghost">닫기</button>
      </div>
    </div>

    <div class="p-6 space-y-7">
      ${b.issues.length ? `<div class="space-y-2">
        ${b.issues.map((i) => `
          <div class="flex gap-2 text-[12px] leading-relaxed px-3 py-2.5 rounded-lg
                      ${i.level === 'warn' ? 'bg-[#fdf3e3] text-[#8a5a00]' : 'bg-chip text-muted'}">
            <span class="font-bold shrink-0">${i.level === 'warn' ? '확인' : '참고'}</span>
            <span>${esc(i.text)}</span>
          </div>`).join('')}
      </div>` : ''}

      <section>
        <h3 class="text-[12px] font-bold text-faint tracking-wide mb-3">7단계 진행</h3>
        <ol class="space-y-1">
          ${b.stages.map((s) => {
            const on = s.docs.length > 0;
            return `
            <li class="rounded-lg ${on ? '' : 'opacity-60'}">
              <div class="flex items-center gap-2.5 px-3 py-2">
                <span class="w-5 h-5 rounded-md text-[11px] font-bold flex items-center justify-center shrink-0
                      ${on ? 'bg-ink text-white' : 'bg-chip text-faint'}">${s.id}</span>
                <span class="text-[13px] font-semibold">${esc(s.label)}</span>
                <span class="ml-auto text-[11px] text-faint font-semibold">${on ? `${s.docs.length}건` : '없음'}</span>
              </div>
              ${on ? `<ul class="pl-[42px] pr-3 pb-2 space-y-1">${s.docs.map(docLink).join('')}</ul>` : ''}
            </li>`;
          }).join('')}
        </ol>
      </section>

      ${b.aside.some((a) => a.docs.length) ? `
        <section>
          <h3 class="text-[12px] font-bold text-faint tracking-wide mb-3">그 밖의 자료</h3>
          ${b.aside.filter((a) => a.docs.length).map((a) => `
            <div class="mb-3">
              <div class="text-[12px] font-semibold mb-1">${esc(a.label)}</div>
              <ul class="space-y-1">${a.docs.map(docLink).join('')}</ul>
            </div>`).join('')}
        </section>` : ''}

      <section>
        <h3 class="text-[12px] font-bold text-faint tracking-wide mb-3">직접 입력</h3>
        <div class="grid grid-cols-2 gap-3">
          ${field('piAmount', '계약 총액 (PI)', { placeholder: 'USD' })}
          ${field('ciAmount', '실출하 총액 (CI&PL)', { placeholder: 'USD' })}
          ${field('container', '컨테이너 번호')}
          ${field('due', '마감 예정일', { type: 'date' })}
          ${field('etd', '출항일', { type: 'date' })}
          ${field('eta', '도착 예정일', { type: 'date' })}
        </div>
        <label class="block mt-3">
          <span class="text-[11px] font-bold text-faint tracking-wide">메모</span>
          <textarea data-ov="memo" rows="4" class="field mt-1 resize-y">${esc(ov.memo ?? '')}</textarea>
        </label>
        <div class="flex items-center gap-2 mt-3">
          <button id="ovSave" class="btn btn-primary">저장</button>
          <span class="text-[11px] text-faint">
            ${state.demo ? '데모 모드에서는 저장되지 않습니다.'
              : ov.updatedBy ? `마지막 수정 ${esc(ov.updatedBy)} · ${esc((ov.updatedAt ?? '').slice(0, 10))}`
              : '팀 전체에 실시간으로 반영됩니다.'}
          </span>
        </div>
      </section>
    </div>`;

  $('#drawerClose').onclick = closeDrawer;
  $('#ovSave').onclick = () => saveOverlay(id);
  for (const el of $('#drawerBody').querySelectorAll('[data-doc]')) {
    el.onclick = () => openDoc(b.docs.find((d) => d.path === el.dataset.doc));
  }
}

async function openDoc(doc) {
  if (!doc) return;
  if (state.demo) return toast('데모 모드라 파일을 열 수 없습니다.');
  if (!state.root) return toast('이 기기에서는 폴더가 연결돼 있지 않아 원본을 열 수 없습니다.');
  try {
    await FS.openByPath(state.root, doc.path);
  } catch (e) {
    toast(`열지 못했습니다: ${e.message}`);
  }
}

async function saveOverlay(id) {
  const data = {};
  for (const el of $('#drawerBody').querySelectorAll('[data-ov]')) {
    const v = el.value.trim();
    if (v) data[el.dataset.ov] = v;
  }
  if (state.demo) {
    state.overlay[id] = data;
    return toast('데모 모드라 저장하지 않습니다.');
  }
  try {
    await DB.saveOverlay(id, data, state.user?.email);
    toast('저장했습니다.');
  } catch (e) {
    toast(`저장 실패: ${e.message}`);
  }
}

/* ── 토스트 ───────────────────────────────────────────── */

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.opacity = '0'), 2600);
}

boot();

</script>

</html>
